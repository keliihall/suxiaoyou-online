worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    # Re-resolve recreated Compose containers rather than retaining stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # The API independently enforces its configured limit on received bytes.
    client_max_body_size 51m;
    client_body_timeout 30s;
    send_timeout 300s;

    server {
        listen 8080;
        server_name _;
        set $cloud_api http://api:8000;
        set $cloud_web http://web:3000;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location /api/ {
            proxy_pass $cloud_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # SSE must reach the browser as it is committed to the database.
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
        }

        location = /livez { proxy_pass $cloud_api; }
        location = /readyz { proxy_pass $cloud_api; }

        location = /health { proxy_pass $cloud_api; }

        location / {
            proxy_pass $cloud_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
